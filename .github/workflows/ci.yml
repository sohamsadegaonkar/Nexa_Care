name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements_dev.txt

      - name: Lint
        run: ruff check .

      # F-12 fix: was `python -m unittest discover -s tests -v`
      #
      # unittest discover collected test_route_registration.py and
      # test_sharding.py but found no TestCase subclasses in them (they use
      # bare `assert` statements — pytest style).  It reported them as
      # passing with zero tests run, meaning:
      #   • the aadhaar_abha_id routing regression guard (test_sharding.py)
      #   • the duplicate-route registration guard (test_route_registration.py)
      # never executed in CI.  Switching to pytest collects and runs all
      # test functions regardless of whether they are TestCase subclasses.
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
        env:
          # F-11 fix: PROVIDER_API_KEY removed. It backed
          # app/api/auth_deps.py (X-Provider-Key header), which has been
          # deleted — every provider-gated route now authenticates
          # exclusively via verify_provider_token()
          # (Authorization: Bearer {CLINIC_API_KEY}). Keeping two env
          # vars for one concept was exactly the confusion F-11 flagged;
          # CLINIC_API_KEY is now the only facility credential anywhere
          # in this pipeline.
          SUPABASE_URL: "https://placeholder.supabase.co"
          SUPABASE_KEY: "placeholder-key"
          UPSTASH_REDIS_URL: "redis://localhost:6379"
          HANDSHAKE_PEPPER_SECRET: "ci-test-pepper"
          CLINIC_API_KEY: "ci-test-clinic-key"