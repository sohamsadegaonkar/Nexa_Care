name: One-use Slice 6H guardrail patch

on:
  push:
    branches: [slice-6h-mobile-native]
    paths: [.github/workflows/slice6h-test-guardrail-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slice-6h-mobile-native
          fetch-depth: 0
      - name: Patch stale architecture assertions exactly
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one old snippet, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          consent = 'tests/test_consent_signing.py'
          replace_exact(consent,
          '''    def test_uses_p256_curve(self) -> None:
              code = _read(CONSENT_SIGNING_PATH)
              assert "@noble/curves/p256" in code, "Must import P-256 from @noble/curves"

          ''',
          '''    def test_uses_p256_curve(self) -> None:
              android = _read(ROOT / "nexa-client/apps/expo/modules/nexa-device-security/android/src/main/java/ai/nexacare/devicesecurity/NexaDeviceSecurityModule.kt")
              ios = _read(ROOT / "nexa-client/apps/expo/modules/nexa-device-security/ios/NexaDeviceSecurityModule.swift")
              assert "secp256r1" in android
              assert "kSecAttrKeyTypeECSECPrimeRandom" in ios
              assert "kSecAttrKeySizeInBits" in ios and "256" in ios

          ''')
          replace_exact(consent,
          '''    def test_uses_secure_store_for_private_key(self) -> None:
              code = _read(CONSENT_SIGNING_PATH)
              assert "expo-secure-store" in code, "Must use expo-secure-store for private key"
              assert (
                  "DEVICE_PRIVATE_KEY_STORAGE_KEY" in code
              ), "Must reference private key storage key"

          ''',
          '''    def test_uses_secure_store_for_private_key(self) -> None:
              code = CONSENT_SIGNING_PATH.read_text(encoding="utf-8")
              assert "signWithNativeDeviceKey" in code
              assert "DEVICE_PRIVATE_KEY_STORAGE_KEY" not in code
              assert "expo-secure-store" not in code

          ''')
          replace_exact(consent,
          '''    def test_hashes_with_sha256_before_signing(self) -> None:
              """Must SHA-256 hash the message before signing with @noble/curves."""
              code = _read(CONSENT_SIGNING_PATH)
              assert "SHA256" in code or "SHA-256" in code, "Must hash with SHA-256"
              assert (
                  "Crypto.digest" in code or "crypto.subtle" in code
              ), "Must use expo-crypto or equivalent for hashing"

              def test_signs_with_ecdsa_p256(self) -> None:
                  """Must sign the hash with ECDSA P-256."""
                  code = _read(CONSENT_SIGNING_PATH)
                  assert "p256.sign" in code, "Must sign with p256.sign"

              def test_exports_der_signature(self) -> None:
                  """Backend verifies DER-encoded signatures."""
                  code = _read(CONSENT_SIGNING_PATH)
                  assert "toDERRawBytes" in code, "Must export DER-encoded signature"

          ''',
          '''    def test_hashes_with_sha256_before_signing(self) -> None:
              """Native platform signers must apply SHA-256 as part of ECDSA signing."""
              android = _read(ROOT / "nexa-client/apps/expo/modules/nexa-device-security/android/src/main/java/ai/nexacare/devicesecurity/NexaDeviceSecurityModule.kt")
              ios = _read(ROOT / "nexa-client/apps/expo/modules/nexa-device-security/ios/NexaDeviceSecurityModule.swift")
              assert "SHA256withECDSA" in android
              assert "ecdsaSignatureMessageX962SHA256" in ios

              def test_signs_with_ecdsa_p256(self) -> None:
                  """Routine consent signing must terminate at the native alias boundary."""
                  code = CONSENT_SIGNING_PATH.read_text(encoding="utf-8")
                  native = _read(ROOT / "nexa-client/packages/app/services/nativeDeviceSecurity.ts")
                  assert "signWithNativeDeviceKey" in code
                  assert "signWithNativeDeviceKey" in native
                  assert "p256.sign" not in code

              def test_exports_der_signature(self) -> None:
                  """Native ECDSA signers return X9.62/ASN.1 DER signatures as base64."""
                  android = _read(ROOT / "nexa-client/apps/expo/modules/nexa-device-security/android/src/main/java/ai/nexacare/devicesecurity/NexaDeviceSecurityModule.kt")
                  ios = _read(ROOT / "nexa-client/apps/expo/modules/nexa-device-security/ios/NexaDeviceSecurityModule.swift")
                  assert "Base64.encodeToString(signer.sign()" in android
                  assert "ecdsaSignatureMessageX962SHA256" in ios
                  assert "signature.base64EncodedString()" in ios

          ''')
          replace_exact(consent,
          '''    def test_alpha_labels_present(self) -> None:
              code = _read(CONSENT_SIGNING_PATH)
              code_norm = _normalize_ws(code)
              assert "ALPHA" in code_norm, "Must label as ALPHA"
              assert (
                  "P-256 keypair generated client-side" in code_norm
              ), "Must state honest ALPHA claim"
              assert "Not yet" in code_norm, "Must state not-yet capability"

          ''',
          '''    def test_native_custody_nonclaims_present(self) -> None:
              code = CONSENT_SIGNING_PATH.read_text(encoding="utf-8")
              assert "Private-key operations use native key handles" in code
              assert "p256.sign" not in code
              assert "fully secure" not in code.lower()

          ''')
          replace_exact(consent,
          '''    def test_ecdsa_p256_matches_backend(self) -> None:
              """Both use ECDSA P-256 for signing/verification."""
              client_code = _read(CONSENT_SIGNING_PATH)
              backend_code = _read(SIGNED_VERIFIER_PATH)
              assert "p256" in client_code, "Client uses P-256"
              assert (
                  "SECP256R1" in backend_code or "ec.ECDSA" in backend_code
              ), "Backend verifies with ECDSA P-256"

          ''',
          '''    def test_ecdsa_p256_matches_backend(self) -> None:
              """Native client keys and backend verification use ECDSA P-256."""
              android = _read(ROOT / "nexa-client/apps/expo/modules/nexa-device-security/android/src/main/java/ai/nexacare/devicesecurity/NexaDeviceSecurityModule.kt")
              ios = _read(ROOT / "nexa-client/apps/expo/modules/nexa-device-security/ios/NexaDeviceSecurityModule.swift")
              backend_code = _read(SIGNED_VERIFIER_PATH)
              assert "secp256r1" in android
              assert "kSecAttrKeySizeInBits" in ios and "256" in ios
              assert (
                  "SECP256R1" in backend_code or "ec.ECDSA" in backend_code
              ), "Backend verifies with ECDSA P-256"

          ''')

          device = 'tests/test_device_keys.py'
          replace_exact(device,
          '''def test_native_keyring_persists_only_aliases() -> None:
              code = _read(NATIVE_KEYRING)
              assert "DEVICE_NATIVE_KEY_ALIAS_STORAGE_KEY" in code
              assert "DEVICE_PENDING_NATIVE_KEY_ALIAS_STORAGE_KEY" in code
              assert "ensurePendingNativeDeviceKey" in code
              assert "commitPendingNativeDeviceKey" in code
              assert "clearCurrentNativeDeviceKey" in code
              assert "publicKeyDerBase64" in code
              assert "privateKey" not in code

          ''',
          '''def test_native_keyring_persists_only_aliases() -> None:
              code = _read(NATIVE_KEYRING)
              assert "DEVICE_NATIVE_KEY_ALIAS_STORAGE_KEY" in code
              assert "DEVICE_PENDING_NATIVE_KEY_ALIAS_STORAGE_KEY" in code
              assert "ensurePendingNativeDeviceKey" in code
              assert "commitPendingNativeDeviceKey" in code
              assert "clearCurrentNativeDeviceKey" in code
              assert "getNativeDeviceKey" in code
              assert "privateKey" not in code

          ''')
          replace_exact(device,
          '''def test_trusted_device_management_is_server_first_for_revocation() -> None:
              code = _read(MANAGEMENT)
              assert code.index("NexaApiClient.revokeDevice") < code.index("clearCurrentNativeDeviceKey")
              assert "rotateCurrentNativeDeviceKey" in code
              assert "isCurrentInstallation" in code

          ''',
          '''def test_trusted_device_management_is_server_first_for_revocation() -> None:
              code = _read(MANAGEMENT)
              body = code.split("export async function revokeManagedPatientDevice", 1)[1].split("\n}", 1)[0]
              assert body.index("NexaApiClient.revokeDevice") < body.index("clearCurrentNativeDeviceKey")
              assert "rotateCurrentNativeDeviceKey" in code
              assert "isCurrentInstallation" in code

          ''')

          screens = 'tests/test_patient_screens.py'
          replace_exact(screens,
          '''    def test_secure_device_labels_alpha(self) -> None:
              code = _read_screen("SecureDeviceScreen")
              code_norm = _normalize_ws(code)
              assert (
                  "ALPHA" in code_norm
              ), "SecureDeviceScreen must label key generation as ALPHA"
              # Must use precise honest phrasing (whitespace-normalized for JSX wrapping)
              assert (
                  "P-256 keypair generated client-side" in code_norm
                  and "private key stored in platform secure storage" in code_norm
              ), (
                  "SecureDeviceScreen must use honest ALPHA claim: "
                  "'P-256 keypair generated client-side and private key stored "
                  "in platform secure storage'"
              )
              assert (
                  "Not yet" in code_norm
                  and "hardware-backed non-exportable signing key" in code_norm
              ), (
                  "SecureDeviceScreen must state not-yet: hardware-backed non-exportable "
                  "signing key with biometric-gated key usage"
              )

          ''',
          '''    def test_secure_device_native_custody_is_truthful(self) -> None:
              code = _read_screen("SecureDeviceScreen")
              code_norm = _normalize_ws(code)
              assert "native device-security module" in code_norm
              assert "only its public key" in code_norm
              assert "hardware-backed or StrongBox-backed is determined by that device at runtime" in code_norm
              assert "Physical-device execution is qualified separately" in code_norm
              assert "P-256 keypair generated client-side" not in code_norm

          ''')
          replace_exact(screens,
          '''    def test_device_enrolled_labels_alpha(self) -> None:
              code = _read_screen("DeviceEnrolledScreen")
              assert "ALPHA" in code, "DeviceEnrolledScreen must label key storage as ALPHA"

          ''',
          '''    def test_device_enrolled_separates_compile_from_physical_proof(self) -> None:
              code = _read_screen("DeviceEnrolledScreen")
              assert "native key alias" in code
              assert "Native build qualification does not by itself prove physical" in code
              assert "/patient/devices" in code

          ''')
          replace_exact(screens,
          '''    def test_generates_keypair(self) -> None:
              code = _read_screen("SecureDeviceScreen")
              assert (
                  "generateDeviceKeypair" in code or "keypair" in code.lower()
              ), "Must generate device keypair"

              def test_alpha_honest_crypto_labels(self) -> None:
                  """Must label as ALPHA with honest limitations about key generation."""
                  code = _read_screen("SecureDeviceScreen")
                  code_norm = _normalize_ws(code)
                  assert "ALPHA" in code_norm, "Must label key generation as ALPHA"
                  # Must use precise honest phrasing (whitespace-normalized for JSX wrapping)
                  assert (
                      "P-256 keypair generated client-side" in code_norm
                  ), "Must state: P-256 keypair generated client-side"
                  assert (
                      "private key stored in platform secure storage" in code_norm
                  ), "Must state: private key stored in platform secure storage"
                  assert (
                      "Not yet" in code_norm
                  ), "Must state 'Not yet' for unimplemented capability"
                  assert (
                      "hardware-backed non-exportable signing key" in code_norm
                  ), "Must state not-yet: hardware-backed non-exportable signing key"
                  assert (
                      "biometric-gated key usage" in code_norm
                  ), "Must state not-yet: biometric-gated key usage"

          ''',
          '''    def test_generates_native_signing_authority(self) -> None:
              code = _read_screen("SecureDeviceScreen")
              assert "ensureCurrentDeviceEnrollment" in code
              assert "Creating native signing authority" in code
              assert "generateDeviceKeypair" not in code

              def test_native_crypto_labels_are_honest(self) -> None:
                  code = _read_screen("SecureDeviceScreen")
                  code_norm = _normalize_ws(code)
                  assert "native key handle" in code_norm
                  assert "Only the public key and non-secret device metadata leave this installation" in code_norm
                  assert "Physical-device execution is qualified separately" in code_norm
                  assert "fully secure" not in code_norm.lower()

          ''')
          replace_exact(screens,
          '''def test_patient_error_messages_use_explicit_jsx_branches(screen_name: str) -> None:
              code = _read_screen(screen_name)
              assert "{error &&" not in code
              assert "{error !== null ?" in code

          ''',
          '''def test_patient_error_messages_use_explicit_jsx_branches(screen_name: str) -> None:
              code = _read_screen(screen_name)
              assert "{error &&" not in code
              assert "{error !== null ?" in code or "{error ?" in code

          ''')
          PY
          git rm .github/workflows/slice6h-test-guardrail-patch.yml
          git diff --check
      - name: Commit exact guardrail migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_consent_signing.py tests/test_device_keys.py tests/test_patient_screens.py
          git commit -m "test(mobile): migrate legacy assertions to native custody"
          git push origin HEAD:slice-6h-mobile-native
