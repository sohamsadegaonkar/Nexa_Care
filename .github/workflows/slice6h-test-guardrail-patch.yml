name: One-use Slice 6H guardrail patch

on:
  push:
    branches: [slice-6h-mobile-native]
    paths: [.github/workflows/slice6h-test-guardrail-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slice-6h-mobile-native
          fetch-depth: 0
      - name: Patch stale architecture assertions by named function
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_function(path: str, name: str, replacement: str, indent: int) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              pad = ' ' * indent
              if indent:
                  stop = r'(?=^' + re.escape(pad) + r'def |^class |^# [═=]|\Z)'
              else:
                  stop = r'(?=^def |^class |^# [═=]|\Z)'
              pattern = r'(?ms)^' + re.escape(pad) + r'def ' + re.escape(name) + r'\(.*?' + stop
              updated, count = re.subn(pattern, replacement.rstrip() + '\n\n', text, count=1)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one function {name}, replaced {count}')
              p.write_text(updated, encoding='utf-8')

          consent = 'tests/test_consent_signing.py'
          replace_function(consent, 'test_uses_p256_curve', '''    def test_uses_p256_curve(self) -> None:
              android = _read(ROOT / "nexa-client/apps/expo/modules/nexa-device-security/android/src/main/java/ai/nexacare/devicesecurity/NexaDeviceSecurityModule.kt")
              ios = _read(ROOT / "nexa-client/apps/expo/modules/nexa-device-security/ios/NexaDeviceSecurityModule.swift")
              assert "secp256r1" in android
              assert "kSecAttrKeyTypeECSECPrimeRandom" in ios
              assert "kSecAttrKeySizeInBits" in ios and "256" in ios
          ''', 4)
          replace_function(consent, 'test_uses_secure_store_for_private_key', '''    def test_routine_consent_uses_native_key_handle_not_securestore_scalar(self) -> None:
              code = CONSENT_SIGNING_PATH.read_text(encoding="utf-8")
              assert "signWithNativeDeviceKey" in code
              assert "DEVICE_PRIVATE_KEY_STORAGE_KEY" not in code
              assert "expo-secure-store" not in code
          ''', 4)
          replace_function(consent, 'test_hashes_with_sha256_before_signing', '''    def test_hashes_with_sha256_before_signing(self) -> None:
              android = _read(ROOT / "nexa-client/apps/expo/modules/nexa-device-security/android/src/main/java/ai/nexacare/devicesecurity/NexaDeviceSecurityModule.kt")
              ios = _read(ROOT / "nexa-client/apps/expo/modules/nexa-device-security/ios/NexaDeviceSecurityModule.swift")
              assert "SHA256withECDSA" in android
              assert "ecdsaSignatureMessageX962SHA256" in ios
          ''', 4)
          replace_function(consent, 'test_signs_with_ecdsa_p256', '''    def test_signs_with_ecdsa_p256(self) -> None:
              code = CONSENT_SIGNING_PATH.read_text(encoding="utf-8")
              native = _read(ROOT / "nexa-client/packages/app/services/nativeDeviceSecurity.ts")
              assert "signWithNativeDeviceKey" in code
              assert "signWithNativeDeviceKey" in native
              assert "p256.sign" not in code
          ''', 4)
          replace_function(consent, 'test_exports_der_signature', '''    def test_exports_der_signature(self) -> None:
              android = _read(ROOT / "nexa-client/apps/expo/modules/nexa-device-security/android/src/main/java/ai/nexacare/devicesecurity/NexaDeviceSecurityModule.kt")
              ios = _read(ROOT / "nexa-client/apps/expo/modules/nexa-device-security/ios/NexaDeviceSecurityModule.swift")
              assert "Base64.encodeToString(signer.sign()" in android
              assert "ecdsaSignatureMessageX962SHA256" in ios
              assert "signature.base64EncodedString()" in ios
          ''', 4)
          replace_function(consent, 'test_alpha_labels_present', '''    def test_native_custody_nonclaims_present(self) -> None:
              code = CONSENT_SIGNING_PATH.read_text(encoding="utf-8")
              assert "Private-key operations use native key handles" in code
              assert "p256.sign" not in code
              assert "fully secure" not in code.lower()
          ''', 4)
          replace_function(consent, 'test_ecdsa_p256_matches_backend', '''    def test_ecdsa_p256_matches_backend(self) -> None:
              android = _read(ROOT / "nexa-client/apps/expo/modules/nexa-device-security/android/src/main/java/ai/nexacare/devicesecurity/NexaDeviceSecurityModule.kt")
              ios = _read(ROOT / "nexa-client/apps/expo/modules/nexa-device-security/ios/NexaDeviceSecurityModule.swift")
              backend_code = _read(SIGNED_VERIFIER_PATH)
              assert "secp256r1" in android
              assert "kSecAttrKeySizeInBits" in ios and "256" in ios
              assert "SECP256R1" in backend_code or "ec.ECDSA" in backend_code
          ''', 4)

          device = 'tests/test_device_keys.py'
          replace_function(device, 'test_native_keyring_persists_only_aliases', '''def test_native_keyring_persists_only_aliases() -> None:
              code = _read(NATIVE_KEYRING)
              assert "DEVICE_NATIVE_KEY_ALIAS_STORAGE_KEY" in code
              assert "DEVICE_PENDING_NATIVE_KEY_ALIAS_STORAGE_KEY" in code
              assert "ensurePendingNativeDeviceKey" in code
              assert "commitPendingNativeDeviceKey" in code
              assert "clearCurrentNativeDeviceKey" in code
              assert "getNativeDeviceKey" in code
              assert "privateKey" not in code
          ''', 0)
          replace_function(device, 'test_trusted_device_management_is_server_first_for_revocation', '''def test_trusted_device_management_is_server_first_for_revocation() -> None:
              code = _read(MANAGEMENT)
              body = code.split("export async function revokeManagedPatientDevice", 1)[1].split("\n}", 1)[0]
              assert body.index("NexaApiClient.revokeDevice") < body.index("clearCurrentNativeDeviceKey")
              assert "rotateCurrentNativeDeviceKey" in code
              assert "isCurrentInstallation" in code
          ''', 0)

          screens = 'tests/test_patient_screens.py'
          replace_function(screens, 'test_secure_device_labels_alpha', '''    def test_secure_device_native_custody_is_truthful(self) -> None:
              code = _read_screen("SecureDeviceScreen")
              code_norm = _normalize_ws(code)
              assert "native device-security module" in code_norm
              assert "register only its public key" in code_norm
              assert "hardware-backed or StrongBox-backed is determined by that device at runtime" in code_norm
              assert "Physical-device execution is qualified separately" in code_norm
              assert "P-256 keypair generated client-side" not in code_norm
          ''', 4)
          replace_function(screens, 'test_device_enrolled_labels_alpha', '''    def test_device_enrolled_separates_compile_from_physical_proof(self) -> None:
              code = _read_screen("DeviceEnrolledScreen")
              assert "native key alias" in code
              assert "Native build qualification does not by itself prove physical" in code
              assert "/patient/devices" in code
          ''', 4)
          replace_function(screens, 'test_generates_keypair', '''    def test_generates_native_signing_authority(self) -> None:
              code = _read_screen("SecureDeviceScreen")
              assert "ensureCurrentDeviceEnrollment" in code
              assert "Creating native signing authority" in code
              assert "generateDeviceKeypair" not in code
          ''', 4)
          replace_function(screens, 'test_alpha_honest_crypto_labels', '''    def test_native_crypto_labels_are_honest(self) -> None:
              code = _read_screen("SecureDeviceScreen")
              code_norm = _normalize_ws(code)
              assert "native key handle" in code_norm
              assert "Only the public key and non-secret device metadata leave this installation" in code_norm
              assert "Physical-device execution is qualified separately" in code_norm
              assert "fully secure" not in code_norm.lower()
          ''', 4)
          replace_function(screens, 'test_patient_error_messages_use_explicit_jsx_branches', '''def test_patient_error_messages_use_explicit_jsx_branches(screen_name: str) -> None:
              code = _read_screen(screen_name)
              assert "{error &&" not in code
              assert "{error !== null ?" in code or "{error ?" in code
          ''', 0)
          PY
          git rm .github/workflows/slice6h-test-guardrail-patch.yml
          git diff --check
      - name: Commit exact guardrail migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_consent_signing.py tests/test_device_keys.py tests/test_patient_screens.py
          git commit -m "test(mobile): migrate legacy assertions to native custody"
          git push origin HEAD:slice-6h-mobile-native
