name: One-use Slice 7A reconciliation

on:
  push:
    branches:
      - slice-7-reconciliation
    paths:
      - .github/workflows/slice7-7a-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile current authority documentation and tests
        shell: bash
        env:
          EXPECTED_PARENT: 9a2a8b7092f062ca4e1e3ddcc886b21a38dab89e
        run: |
          set -euo pipefail

          parent="$(git rev-parse HEAD^)"
          if [[ "$parent" != "$EXPECTED_PARENT" ]]; then
            echo "Refusing reconciliation: workflow parent $parent != $EXPECTED_PARENT" >&2
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path

          ROOT = Path('.')
          CURRENT_HEAD = '20260909_device_trust_lifecycle'
          BASELINE = 'aa091e14cf38124ca81e32438b49bdad4d79be8b'

          def replace_once(path: str, old: str, new: str) -> None:
              p = ROOT / path
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one occurrence, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # CI-discovered brittle assertions: preserve semantics, not incidental wording.
          replace_once(
              'tests/test_current_authority_contract_docs.py',
              '    assert "JavaScript-readable raw P-256 scalar" in contract\n',
              '    assert "native key aliases" in contract\n'
              '    assert "JavaScript-readable raw" in contract\n',
          )
          replace_once(
              'tests/test_current_authority_contract_docs.py',
              '    assert "official live ABDM/NHA HPR/HFR" in current\n',
              '    assert "Official live ABDM/NHA HPR/HFR" in current\n',
          )

          test_path = ROOT / 'tests/test_current_authority_contract_docs.py'
          test_text = test_path.read_text(encoding='utf-8')
          marker = '\ndef test_alpha_architecture_is_explicitly_historical() -> None:\n'
          if marker not in test_text:
              test_text += (
                  '\n\ndef test_alpha_architecture_is_explicitly_historical() -> None:\n'
                  '    architecture = _read("docs/ARCHITECTURE.md")\n\n'
                  '    assert "Historical Alpha snapshot" in architecture\n'
                  '    assert "docs/CURRENT-STATE.md" in architecture\n'
                  '    assert "docs/API-CONTRACTS.md" in architecture\n'
              )
              test_path.write_text(test_text, encoding='utf-8')

          # Deployment tests derive the migration head from the executable migration tool.
          replace_once(
              'tests/test_pilot_deployment_hardening.py',
              '    assert "20260906_verification_scheduler" in content\n',
              '    assert run_pilot_migrations.EXPECTED_HEAD in content\n',
          )
          replace_once(
              'tests/test_pilot_deployment_hardening.py',
              '    assert "Current head is `20260906_verification_scheduler`" in constitution\n',
              '    assert (\n'
              '        f"Current head is `{run_pilot_migrations.EXPECTED_HEAD}`" in constitution\n'
              '    )\n',
          )
          replace_once(
              'tests/test_pilot_deployment_hardening.py',
              '    assert "current head `20260906_verification_scheduler`" in security\n',
              '    assert f"current head `{run_pilot_migrations.EXPECTED_HEAD}`" in security\n',
          )

          # Current-governance metadata and migration contracts.
          replace_once(
              'docs/governance/NEXA_CARE_ENGINEERING_CONSTITUTION.md',
              'Last reviewed: 2026-07-27  \n',
              'Last reviewed: 2026-09-09  \n',
          )
          replace_once(
              'docs/governance/NEXA_CARE_ENGINEERING_CONSTITUTION.md',
              'Repository baseline: `a9d542f` on `feature/document-processing-e2e`; Alembic head `20260727_doc_process_bind`\n',
              f'Repository baseline: `{BASELINE}` on `main`; Alembic head `{CURRENT_HEAD}`\n',
          )
          replace_once(
              'docs/governance/NEXA_CARE_ENGINEERING_CONSTITUTION.md',
              'Current head is `20260906_verification_scheduler`; changing it requires updating architecture contracts and validating ancestry, identifier length, and a single head.\n',
              f'Current head is `{CURRENT_HEAD}`; changing it requires updating architecture contracts and validating ancestry, identifier length, and a single head.\n',
          )

          replace_once(
              'docs/governance/SECURITY_NON_REGRESSION.md',
              'Last reviewed: 2026-09-06\n',
              'Last reviewed: 2026-09-09\n',
          )
          replace_once(
              'docs/governance/SECURITY_NON_REGRESSION.md',
              'Repository baseline: `a695e517fa7d60895f64b7d8744ee24d27cf07b6` on `main`; Alembic head `20260906_verification_scheduler`\n',
              f'Repository baseline: `{BASELINE}` on `main`; Alembic head `{CURRENT_HEAD}`\n',
          )
          replace_once(
              'docs/governance/SECURITY_NON_REGRESSION.md',
              '`scripts/run_pilot_migrations.py`; current head `20260906_verification_scheduler` |',
              f'`scripts/run_pilot_migrations.py`; current head `{CURRENT_HEAD}` |',
          )

          replace_once(
              'docs/runbooks/MILESTONE_6_FARGATE_DEPLOYMENT.md',
              '   `20260906_verification_scheduler`. Stop if it reports any other head.\n',
              f'   `{CURRENT_HEAD}`. Stop if it reports any other head.\n',
          )

          # Keep the frozen Alpha architecture as history, but make precedence explicit.
          replace_once(
              'docs/ARCHITECTURE.md',
              '**Status:** LOCKED (Specification Freeze for 10-Squad Alpha Milestone)\n\n---\n',
              '**Status:** LOCKED (Specification Freeze for 10-Squad Alpha Milestone)\n\n'
              '> **Historical Alpha snapshot.** For current authority-critical architecture, '
              '`docs/CURRENT-STATE.md` and `docs/API-CONTRACTS.md` take precedence. '
              'The SecureStore signing model and Alpha branch workflow below are historical '
              'and must not be used as current pilot authority or release instructions.\n\n---\n',
          )

          # Machine-check the intended current-head contract after mutation.
          migration = (ROOT / 'scripts/run_pilot_migrations.py').read_text(encoding='utf-8')
          if f'EXPECTED_HEAD = "{CURRENT_HEAD}"' not in migration:
              raise SystemExit('runtime migration tool no longer matches expected Slice 7A head')
          for path in (
              'docs/pilot-security-operations.md',
              'docs/runbooks/MILESTONE_6_FARGATE_DEPLOYMENT.md',
              'docs/governance/NEXA_CARE_ENGINEERING_CONSTITUTION.md',
              'docs/governance/SECURITY_NON_REGRESSION.md',
          ):
              text = (ROOT / path).read_text(encoding='utf-8')
              if CURRENT_HEAD not in text:
                  raise SystemExit(f'{path}: current migration head missing after reconciliation')
          PY

          rm .github/workflows/slice7-7a-reconcile.yml

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(slice7): close 7A migration and authority drift"
          git push origin HEAD:slice-7-reconciliation
