# P1B synthetic real-scanner qualification; no cloud deployment or actual phone.
name: P1B Real Scanner Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p1b-real-scanner-ci.yml"
      - "docs/runbooks/P1B_RECONCILIATION_20261121.md"
      - "docs/governance/P1B_ORIGINAL_DOCUMENT_ACCESS.md"
      - "app/**"
      - "alembic/**"
      - "tests/integration/test_original_document_access.py"
      - "scanner_integration/**"
      - "nexa-client/**"

permissions:
  contents: read

jobs:
  original-document-real-scanner:
    name: Synthetic P1B HTTP with PostgreSQL Redis and real Clamd
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexa
          POSTGRES_PASSWORD: nexa_test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 2s
          --health-retries 8
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 8
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://nexa:nexa_test@127.0.0.1:5432/nexa_qual_ci_shared
      TEST_DATABASE_URL: postgresql+asyncpg://nexa:nexa_test@127.0.0.1:5432/nexa_qual_ci_shared
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
      UPSTASH_REDIS_URL: redis://127.0.0.1:6379/0
      TEST_REDIS_PREFIX: "nexa-investor-qual:"
      NEXA_ALLOW_DISPOSABLE_TEST_DB: "1"
      SUPABASE_URL: https://placeholder.supabase.co
      SUPABASE_KEY: synthetic-placeholder
      HANDSHAKE_PEPPER_SECRET: ci-investor-synthetic-pepper
      KEK_ROOT_SECRET: ci-investor-synthetic-kek-root-secret-32-bytes
      NEXA_PEPPER_KEY: ci-investor-synthetic-pepper-key
      PII_ENCRYPTION_KEY: vkMf8Y8z-UZyqKKtoI2AjRiGgQinLUGH7jrr4hc8vLw=
      MFA_ENCRYPTION_KEY: ru5zUf5rqAFKWFyI_6zfNX4Ewv77BJnpFuKClSVs9E8=
      PATIENT_JWT_SECRET: synthetic-patient-jwt-secret-at-least-32-chars-long
      OTP_RATE_LIMIT_HMAC_SECRET: ci-investor-rate-hmac-secret-32-bytes
      PROVIDER_REGISTRATION_IDEMPOTENCY_HMAC_SECRET: ci-investor-registration-secret-32-bytes
      PROVIDER_CONTACT_ASSURANCE_HMAC_SECRET: ci-investor-contact-secret-32-bytes
      PATIENT_GRANT_REFERENCE_HMAC_SECRET: ci-investor-grant-ref-secret-32-bytes
      DOCUMENT_STORAGE_PROVIDER: local
      DOCUMENT_STORAGE_LOCAL_ROOT: /tmp/nexa-investor-documents
      DOCUMENT_STORAGE_ENCRYPTION_KEY: vkMf8Y8z-UZyqKKtoI2AjRiGgQinLUGH7jrr4hc8vLw=
      DOCUMENT_EXTRACTION_PROVIDER: demo
      ENCRYPTION_BACKEND: local
      P1B_REHEARSAL_CLAMD: "1"
      PATIENT_SOURCE_MALWARE_SCANNER: clamd
      PATIENT_SOURCE_CLAMD_HOST: 127.0.0.1
      PATIENT_SOURCE_CLAMD_PORT: "3310"
      PATIENT_SOURCE_CLAMD_MAX_BYTES: "20971520"
      PATIENT_SOURCE_CLAMD_MAX_SIGNATURE_AGE_HOURS: "168"

    steps:
      - uses: actions/checkout@v4
      - name: Build scanner with official signature refresh
        run: docker build --tag local/investor-clamd:qualification --file scanner_integration/Dockerfile .
      - name: Launch isolated ClamAV daemon
        run: |
          docker run -d --name investor-clamd -p 3310:3310 \
            -e CLAMAV_NO_CLAMD=false \
            -e CLAMAV_NO_FRESHCLAMD=true \
            -e CLAMAV_NO_MILTERD=true \
            -e CLAMD_STARTUP_TIMEOUT=300 \
            local/investor-clamd:qualification
          docker image inspect local/investor-clamd:qualification --format='SCANNER_IMAGE_ID={{.Id}}'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python and document-reading dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils
          python -m pip install -r requirements.txt -r requirements_dev.txt
      - name: Create and migrate disposable database only
        run: python scripts/ci/prepare_ci_shared_db.py
      - name: Wait for full scanner readiness
        run: |
          python - <<'PY'
          import asyncio
          from app.security.patient_source_malware_scanner import (
              ClamdPatientSourceMalwareScanner, get_patient_source_malware_scanner_config,
          )

          async def check():
              scanner = ClamdPatientSourceMalwareScanner(get_patient_source_malware_scanner_config())
              for _ in range(30):
                  try:
                      if await scanner.ready():
                          print("INVESTOR_REAL_CLAMD_READY=PASS")
                          return
                  except Exception:
                      pass
                  await asyncio.sleep(5)
              raise SystemExit("real clamd readiness timed out")
          asyncio.run(check())
          PY
      - name: Run full signed-original HTTP flow against real scanner
        run: |
          python -m pytest tests/integration/test_original_document_access.py -q --tb=short \
            --junitxml=.test-results/investor-original-real-scanner.xml
          python scripts/ci/assert_pytest_junit.py .test-results/investor-original-real-scanner.xml
      - name: Stop isolated scanner
        if: always()
        run: |
          docker stop investor-clamd || true
          docker rm investor-clamd || true
