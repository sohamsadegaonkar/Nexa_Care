name: One-shot Slice 6E auth authority patch

on:
  push:
    branches:
      - slice-6e-lost-device-account-recovery
    paths:
      - .github/workflows/one-shot-6e-auth-authority.yml

permissions:
  contents: write

jobs:
  patch-auth-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slice-6e-lost-device-account-recovery
          fetch-depth: 0
      - name: Apply Slice 6E backend authority compatibility patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_count(path_name: str, old: str, new: str, expected: int = 1) -> None:
              path = Path(path_name)
              source = path.read_text()
              count = source.count(old)
              if count != expected:
                  raise SystemExit(f'{path_name}: anchor count={count}, expected={expected}: {old[:100]!r}')
              path.write_text(source.replace(old, new, expected))

          def regex_once(path_name: str, pattern: str, replacement: str) -> None:
              path = Path(path_name)
              source = path.read_text()
              updated, count = re.subn(pattern, replacement, source, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f'{path_name}: regex count={count}: {pattern[:100]!r}')
              path.write_text(updated)

          auth = 'app/api/v2/auth_routes.py'
          replace_count(
              auth,
              '    device_enrollment_token: str\n',
              '    device_enrollment_token: str | None = None\n    device_authority_state: str\n',
          )
          helper = (
              'async def _patient_device_login_authority(\n'
              '    db: AsyncSession, *, patient_id: str, session_id: str\n'
              ') -> tuple[str | None, str]:\n'
              '    """Keep account authentication separate from bootstrap device authority."""\n'
              '    from app.services.patient_device_recovery_transactions import patient_has_device_history\n\n'
              '    if await patient_has_device_history(db, patient_id=UUID(patient_id)):\n'
              '        return None, "existing_device_required"\n'
              '    token = await issue_device_enrollment_token(patient_id, session_id)\n'
              '    return token, "bootstrap_enrollment"\n\n\n'
          )
          replace_count(
              auth,
              '@router.post("/otp/send", response_model=PatientOtpSendResponse)\n',
              helper + '@router.post("/otp/send", response_model=PatientOtpSendResponse)\n',
          )
          replace_count(
              auth,
              '        enrollment_token = await issue_device_enrollment_token(patient_id, session_id)\n',
              '        enrollment_token, device_authority_state = await _patient_device_login_authority(\n'
              '            db, patient_id=patient_id, session_id=session_id\n'
              '        )\n',
          )
          regex_once(
              auth,
              r'        enrollment_token = await issue_device_enrollment_token\(\s*account\.patient_id,\s*session_id\s*\)\n',
              '        enrollment_token, device_authority_state = await _patient_device_login_authority(\n'
              '            db, patient_id=account.patient_id, session_id=session_id\n'
              '        )\n',
          )
          replace_count(
              auth,
              '        device_enrollment_token=enrollment_token,\n',
              '        device_enrollment_token=enrollment_token,\n        device_authority_state=device_authority_state,\n',
              expected=2,
          )

          history_stack = (
              '    stack.enter_context(\n'
              '        patch(\n'
              '            "app.api.v2.device_routes.patient_has_device_history",\n'
              '            new=AsyncMock(return_value=False),\n'
              '        )\n'
              '    )\n'
          )
          for path_name in (
              'tests/integration/test_consent_flow_qa.py',
              'tests/security/test_forged_signature.py',
          ):
              replace_count(path_name, '    stack = ExitStack()\n', '    stack = ExitStack()\n' + history_stack)

          regex_once(
              'tests/test_device_consent.py',
              r'^(        with \(\n)(?=            patch\(\n                "app\.api\.v2\.device_routes\.claim_device_enrollment_token",)',
              r'\1'
              '            patch(\n'
              '                "app.api.v2.device_routes.patient_has_device_history",\n'
              '                new=AsyncMock(return_value=False),\n'
              '            ),\n',
          )
          replace_count(
              'tests/test_device_consent_qa.py',
              'def valid_device_enrollment_grant():\n    with (\n',
              'def valid_device_enrollment_grant():\n    with (\n'
              '        patch(\n'
              '            "app.api.v2.device_routes.patient_has_device_history",\n'
              '            new=AsyncMock(return_value=False),\n'
              '        ),\n',
          )

          otp_test = 'tests/test_patient_otp_auth.py'
          regex_once(
              otp_test,
              r'(^            patch\(\n                "app\.api\.v2\.auth_routes\.issue_device_enrollment_token",\n                new=issue_enrollment,\n            \),\n)',
              r'\1'
              '            patch(\n'
              '                "app.services.patient_device_recovery_transactions.patient_has_device_history",\n'
              '                new=AsyncMock(return_value=False),\n'
              '            ),\n',
          )
          replace_count(
              otp_test,
              '    assert body["device_enrollment_token"] == "enroll-token"\n',
              '    assert body["device_enrollment_token"] == "enroll-token"\n'
              '    assert body["device_authority_state"] == "bootstrap_enrollment"\n',
          )
          existing_history_test = (
              '@pytest.mark.asyncio\n'
              'async def test_existing_device_history_does_not_mint_bootstrap_authority() -> None:\n'
              '    from app.api.v2 import auth_routes\n\n'
              '    issue_enrollment = AsyncMock(return_value="must-not-be-issued")\n'
              '    with (\n'
              '        patch(\n'
              '            "app.services.patient_device_recovery_transactions.patient_has_device_history",\n'
              '            new=AsyncMock(return_value=True),\n'
              '        ),\n'
              '        patch(\n'
              '            "app.api.v2.auth_routes.issue_device_enrollment_token",\n'
              '            new=issue_enrollment,\n'
              '        ),\n'
              '    ):\n'
              '        enrollment_token, authority_state = await auth_routes._patient_device_login_authority(\n'
              '            AsyncMock(),\n'
              '            patient_id="123e4567-e89b-12d3-a456-426614174001",\n'
              '            session_id=SESSION_A,\n'
              '        )\n'
              '    assert enrollment_token is None\n'
              '    assert authority_state == "existing_device_required"\n'
              '    issue_enrollment.assert_not_awaited()\n\n\n'
          )
          replace_count(
              otp_test,
              'def test_otp_verification_fails_closed_when_session_authority_is_unavailable() -> None:\n',
              existing_history_test + 'def test_otp_verification_fails_closed_when_session_authority_is_unavailable() -> None:\n',
          )

          regex_once(
              'tests/test_patient_registration.py',
              r'(^            patch\("app\.api\.v2\.auth_routes\.issue_device_enrollment_token", new=enroll\),\n)',
              r'\1'
              '            patch(\n'
              '                "app.services.patient_device_recovery_transactions.patient_has_device_history",\n'
              '                new=AsyncMock(return_value=False),\n'
              '            ),\n',
          )
          PY
          python -m py_compile app/api/v2/auth_routes.py \
            tests/integration/test_consent_flow_qa.py \
            tests/security/test_forged_signature.py \
            tests/test_device_consent.py \
            tests/test_device_consent_qa.py \
            tests/test_patient_otp_auth.py \
            tests/test_patient_registration.py
          rm .github/workflows/one-shot-6e-auth-authority.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/v2/auth_routes.py \
            tests/integration/test_consent_flow_qa.py \
            tests/security/test_forged_signature.py \
            tests/test_device_consent.py \
            tests/test_device_consent_qa.py \
            tests/test_patient_otp_auth.py \
            tests/test_patient_registration.py \
            .github/workflows/one-shot-6e-auth-authority.yml
          git diff --cached --check
          git commit -m "feat(recovery): enforce account and device authority split"
          git push origin HEAD:slice-6e-lost-device-account-recovery
