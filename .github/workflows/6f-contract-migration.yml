name: One-use Slice 6F contract migration

on:
  push:
    branches:
      - slice-6f-signed-consent-v3
    paths:
      - .github/workflows/6f-contract-migration.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slice-6f-signed-consent-v3
          fetch-depth: 0
      - name: Apply anchored contract migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def load(path):
              return Path(path).read_text(encoding='utf-8')

          def save(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = load(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one anchor, found {count}: {old!r}')
              save(path, text.replace(old, new, 1))

          def replace_all_checked(path, old, new, minimum=1):
              text = load(path)
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f'{path}: expected at least {minimum} anchors, found {count}: {old!r}')
              save(path, text.replace(old, new))

          def replace_in_test(path, test_name, old, new):
              text = load(path)
              marker = f'def {test_name}'
              pos = text.find(marker)
              if pos < 0:
                  raise SystemExit(f'{path}: missing test {test_name}')
              next_plain = text.find('\ndef test_', pos + len(marker))
              next_async = text.find('\nasync def test_', pos + len(marker))
              ends = [x for x in (next_plain, next_async) if x >= 0]
              end = min(ends) if ends else len(text)
              segment = text[pos:end]
              count = segment.count(old)
              if count != 1:
                  raise SystemExit(f'{path}:{test_name}: expected one anchor, found {count}: {old!r}')
              segment = segment.replace(old, new, 1)
              save(path, text[:pos] + segment + text[end:])

          # 1) Route inventory: the four V3 routes are intentional additions.
          path = 'tests/test_route_registration.py'
          anchor = '''    ("POST", "/api/v2/consent/request"),
    ("POST", "/api/v2/consent/approve-signed"),
    ("POST", "/api/v2/consent/{request_id}/claim-access"),
'''
          replacement = anchor + '''    ("POST", "/api/v2/consent/v3/request"),
    ("GET", "/api/v2/consent/v3/challenge/{request_id}"),
    ("POST", "/api/v2/consent/v3/approve-signed"),
    ("POST", "/api/v2/consent/v3/{request_id}/claim-access"),
'''
          replace_once(path, anchor, replacement)

          # 2) Mobile/client contract expectations now point to V3 explicitly.
          replace_once(
              'nexa-client/packages/app/utils/apiClient.test.ts',
              "expect(url).toBe('https://native.example.test/api/v2/consent/request')",
              "expect(url).toBe('https://native.example.test/api/v2/consent/v3/request')",
          )
          replace_once(
              'nexa-client/packages/app/features/doctor/RequestConsentScreen.test.tsx',
              '''      {
        discovery_handle: 'opaque-discovery-handle-12345678901234567890',
        purpose: 'follow_up',
''',
              '''      {
        protocol_version: 'nexa-consent-v3',
        discovery_handle: 'opaque-discovery-handle-12345678901234567890',
        purpose: 'follow_up',
''',
          )

          # 3) Source-contract signing tests must inspect the V3 verifier/endpoints.
          path = 'tests/test_consent_signing.py'
          replace_once(
              path,
              'SIGNED_VERIFIER_PATH = ROOT / "app" / "services" / "signed_approval_verifier.py"',
              'SIGNED_VERIFIER_PATH = ROOT / "app" / "services" / "signed_consent_v3.py"',
          )
          replace_all_checked(path, '/api/v2/consent/approve-signed', '/api/v2/consent/v3/approve-signed', minimum=4)
          replace_all_checked(path, '/api/v2/consent/challenge/', '/api/v2/consent/v3/challenge/', minimum=2)
          replace_all_checked(path, 'nexa-consent-v2', 'nexa-consent-v3', minimum=2)
          insert_anchor = '''    def test_uses_p256_curve(self) -> None:
        code = _read(CONSENT_SIGNING_PATH)
'''
          insert_replacement = '''    def test_current_orchestrator_is_v3_only(self) -> None:
        code = CONSENT_SIGNING_PATH.read_text(encoding="utf-8")
        assert "nexa-consent-v3" in code
        assert "nexa-consent-v2" not in code
        assert "consent_context_hash" in code
        assert "key_id" in code
        assert "key_version" in code
        assert "public_key_fingerprint" in code

    def test_uses_p256_curve(self) -> None:
        code = _read(CONSENT_SIGNING_PATH)
'''
          replace_once(path, insert_anchor, insert_replacement)

          # 4) Newly tagged V2 challenges are deliberately unable to mint capabilities.
          replace_in_test(
              'tests/test_phase_1b2_remediation_security.py',
              'test_consent_audit_failure_with_delete_failure_leaves_inert_challenge',
              'assert claim_error.value.status_code == 409',
              '''assert claim_error.value.status_code == 410
    assert claim_error.value.detail["error_code"] == "SIGNED_CONSENT_V2_ACCESS_RETIRED"
    assert claim_error.value.detail["upgrade_protocol"] == "nexa-consent-v3"''',
          )
          replace_in_test(
              'tests/integration/test_patient_discovery_redis_state_machine.py',
              'test_real_redis_consent_pending_audit_is_inert_after_downstream_failure',
              'assert claim_error.value.status_code == 409',
              '''assert claim_error.value.status_code == 410
    assert claim_error.value.detail["error_code"] == "SIGNED_CONSENT_V2_ACCESS_RETIRED"
    assert claim_error.value.detail["upgrade_protocol"] == "nexa-consent-v3"''',
          )

          # 5) Keep the legacy real-signature QA test, but make its post-approval
          #    assertion prove downgrade retirement instead of expecting V2 authority.
          path = 'tests/integration/test_consent_flow_qa.py'
          replace_once(
              path,
              '    def test_full_consent_flow_with_real_signatures(\n',
              '    def test_v2_signed_flow_is_retired_after_real_signature_approval(\n',
          )
          text = load(path)
          start = text.find('    def test_v2_signed_flow_is_retired_after_real_signature_approval(')
          if start < 0:
              raise SystemExit('legacy QA test rename did not land')
          end = text.find('\n    def test_', start + 10)
          if end < 0:
              raise SystemExit('could not bound legacy QA test')
          segment = text[start:end]
          old = '''            assert claim_resp.status_code == 200, claim_resp.text
            assert claim_resp.headers["cache-control"] == "no-store"
            claim = claim_resp.json()
            assert claim["patient_id"] == patient_id
            consent_token = claim["consent_token"]
            assert consent_token not in str(fake_sync_redis._a.data.keys())

            from app.services.approved_access_capability import validate

            capability = asyncio.run(
                validate(
                    token=consent_token,
                    patient_id=patient_id,
                    provider_id=provider_id,
                    hospital_id=str(provider.hospital_id),
                    requested_category="clinical_summary",
                )
            )
            assert capability is not None
            assert capability.patient_id == patient_id
            assert capability.clinician_id == provider_id
'''
          new = '''            assert claim_resp.status_code == 410, claim_resp.text
            detail = claim_resp.json()["detail"]
            assert detail["error_code"] == "SIGNED_CONSENT_V2_ACCESS_RETIRED"
            assert detail["upgrade_protocol"] == "nexa-consent-v3"
            assert not any(
                str(key).startswith("consent_access:capability:")
                for key in fake_sync_redis._a.data
            )
'''
          if segment.count(old) != 1:
              raise SystemExit(f'legacy QA claim block count={segment.count(old)}')
          segment = segment.replace(old, new, 1)
          save(path, text[:start] + segment + text[end:])

          # Remove this one-use workflow from the product branch before committing.
          Path('.github/workflows/6f-contract-migration.yml').unlink()
          PY

          git diff --check
          python -m compileall -q app tests
          git status --short
      - name: Commit patch and self-delete workflow
        shell: bash
        run: |
          git config user.name "Soham Gajanan Sadegaonkar"
          git config user.email "adt23socb1137@students.mituniversity.edu.in"
          git add -A
          git diff --cached --check
          git commit -m "test(consent): reconcile Signed Consent V3 cutover contracts"
          git push origin HEAD:slice-6f-signed-consent-v3
