name: One-use Slice 6F E2E migration

on:
  push:
    branches: [slice-6f-signed-consent-v3]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slice-6f-signed-consent-v3
          fetch-depth: 0
      - name: Migrate production-shaped E2E flow to V3
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('tests/integration/test_patient_provider_true_e2e.py')
          text = path.read_text(encoding='utf-8')

          old_import = 'from app.services.signed_approval_verifier import canonical_signed_approval_payload\n'
          new_import = 'from app.services.signed_consent_v3 import canonical_signed_consent_v3_payload\n'
          if text.count(old_import) != 1:
              raise SystemExit('V2 canonical import anchor missing')
          text = text.replace(old_import, new_import, 1)

          old_return = '''                "device_id": str(device.id),\n                "card_uid": card_uid,'''
          new_return = '''                "device_id": str(device.device_id),\n                "device_key_id": str(device.id),\n                "device_key_version": device.key_version,\n                "device_key_fingerprint": device.public_key_fingerprint,\n                "card_uid": card_uid,'''
          if text.count(old_return) != 1:
              raise SystemExit('seed device return anchor missing')
          text = text.replace(old_return, new_return, 1)

          pattern = re.compile(r'async def _approve\(.*?\n\n\nasync def test_true_patient_provider_routine_access_e2e', re.S)
          match = pattern.search(text)
          if not match:
              raise SystemExit('_approve function block missing')
          replacement = '''async def _approve(\n    client: httpx.AsyncClient,\n    *,\n    patient_token: str,\n    private_key: ec.EllipticCurvePrivateKey,\n    request_id: str,\n    patient_id: str,\n    device_id: str,\n    key_id: str,\n    key_version: int,\n    public_key_fingerprint: str,\n) -> None:\n    challenge = await client.get(\n        f"/api/v2/consent/v3/challenge/{request_id}",\n        headers={"Authorization": f"Bearer {patient_token}"},\n    )\n    assert challenge.status_code == 200, challenge.text\n    data = challenge.json()\n    assert data["protocol_version"] == "nexa-consent-v3"\n    signing_bytes = canonical_signed_consent_v3_payload(\n        request_id=request_id,\n        patient_id=patient_id,\n        provider_id=data["provider_id"],\n        hospital_id=data["hospital_id"],\n        challenge_nonce=data["challenge_nonce"],\n        decision="approved",\n        purpose=data["purpose"],\n        scope=data["scope"],\n        issued_at=data["issued_at"],\n        expires_at=data["expires_at"],\n        access_duration=data["access_duration"],\n        consent_context_hash=data["consent_context_hash"],\n        device_id=device_id,\n        key_id=key_id,\n        key_version=key_version,\n        public_key_fingerprint=public_key_fingerprint,\n    )\n    digest = hashlib.sha256(signing_bytes).digest()\n    signature = private_key.sign(digest, ec.ECDSA(utils.Prehashed(hashes.SHA256())))\n    response = await client.post(\n        "/api/v2/consent/v3/approve-signed",\n        headers={"Authorization": f"Bearer {patient_token}"},\n        json={\n            "protocol_version": "nexa-consent-v3",\n            "request_id": request_id,\n            "patient_id": patient_id,\n            "decision": "approved",\n            "challenge_nonce": data["challenge_nonce"],\n            "consent_context_hash": data["consent_context_hash"],\n            "signature": base64.b64encode(signature).decode("ascii"),\n            "device_id": device_id,\n            "key_id": key_id,\n            "key_version": key_version,\n            "public_key_fingerprint": public_key_fingerprint,\n        },\n    )\n    assert response.status_code == 200, response.text\n    assert response.json()["status"] == "approved"\n    assert response.json()["protocol_version"] == "nexa-consent-v3"\n    assert "consent_token" not in response.json()\n\n\nasync def test_true_patient_provider_routine_access_e2e'''
          text = text[:match.start()] + replacement + text[match.end():]

          request_path = '"/api/v2/consent/request"'
          if text.count(request_path) != 2:
              raise SystemExit(f'expected two true-e2e request paths, got {text.count(request_path)}')
          text = text.replace(request_path, '"/api/v2/consent/v3/request"')

          discovery_anchor = '                json={\n                    "discovery_handle": discovery["discovery_handle"],'
          if text.count(discovery_anchor) != 3:
              raise SystemExit(f'expected three request JSON anchors (including replay), got {text.count(discovery_anchor)}')
          text = text.replace(
              discovery_anchor,
              '                json={\n                    "protocol_version": "nexa-consent-v3",\n                    "discovery_handle": discovery["discovery_handle"],',
          )

          claim_old = 'f"/api/v2/consent/{request_id}/claim-access"'
          if text.count(claim_old) != 3:
              raise SystemExit(f'expected three claim path uses, got {text.count(claim_old)}')
          text = text.replace(claim_old, 'f"/api/v2/consent/v3/{request_id}/claim-access"')

          call_old = '''                device_id=str(graph["device_id"]),\n            )'''
          call_new = '''                device_id=str(graph["device_id"]),\n                key_id=str(graph["device_key_id"]),\n                key_version=int(graph["device_key_version"]),\n                public_key_fingerprint=str(graph["device_key_fingerprint"]),\n            )'''
          if text.count(call_old) != 2:
              raise SystemExit(f'expected two _approve call anchors, got {text.count(call_old)}')
          text = text.replace(call_old, call_new)

          path.write_text(text, encoding='utf-8')
          PY

          python -m compileall -q tests/integration/test_patient_provider_true_e2e.py
          git rm .github/workflows/slice-6f-e2e-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(consent): qualify V3 in true provider-patient loop"
          git push origin HEAD:slice-6f-signed-consent-v3
