name: One-use Slice 6F implementation patch

on:
  push:
    branches: [slice-6f-signed-consent-v3]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slice-6f-signed-consent-v3
          fetch-depth: 0
      - name: Apply V3 integration patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Fix initial V3 implementation defects.
          replace_once(
              'app/services/signed_consent_v3.py',
              'import json\nimport time',
              'import json\nimport secrets\nimport time',
          )
          replace_once(
              'app/services/signed_consent_v3.py',
              'hashlib.compare_digest(',
              'secrets.compare_digest(',
          )
          replace_once(
              'app/api/v2/consent_v3_routes.py',
              '        "created_at": context.pop("issued_at"),',
              '        "created_at": now.isoformat(),',
          )
          replace_once(
              'app/api/v2/consent_v3_routes.py',
              '    # context.pop above intentionally moved issued_at to the repository\'s\n'
              '    # existing created_at field; restore all other canonical fields unchanged.\n'
              '    request_data["issued_at"] = request_data["created_at"]\n\n',
              '',
          )

          # Register the explicit V3 router.
          replace_once(
              'app/main.py',
              'from app.api.v2.consent_routes import router as consent_v2_router\n',
              'from app.api.v2.consent_routes import router as consent_v2_router\n'
              'from app.api.v2.consent_v3_routes import router as consent_v3_router\n',
          )
          replace_once(
              'app/main.py',
              'app.include_router(consent_v2_router)\n',
              'app.include_router(consent_v2_router)\napp.include_router(consent_v3_router)\n',
          )

          # Tag all newly-created legacy challenges and prevent them from minting
          # record-access authority. Pre-6F in-flight untagged V2 records retain
          # only their existing short Redis lifetime.
          replace_once(
              'app/api/v2/consent_routes.py',
              '    challenge_payload = {\n        "request_id": request_id,',
              '    challenge_payload = {\n        "protocol_version": "nexa-consent-v2",\n        "request_id": request_id,',
          )
          replace_once(
              'app/api/v2/consent_routes.py',
              '    data = json.loads(raw)\n\n    if data.get("status") != "approved":\n        raise HTTPException(\n            status_code=status.HTTP_409_CONFLICT,\n            detail="Consent request is not approved",\n        )\n',
              '    data = json.loads(raw)\n\n'
              '    if data.get("protocol_version") == "nexa-consent-v2":\n'
              '        raise HTTPException(\n'
              '            status_code=status.HTTP_410_GONE,\n'
              '            detail={\n'
              '                "error_code": "SIGNED_CONSENT_V2_ACCESS_RETIRED",\n'
              '                "upgrade_protocol": "nexa-consent-v3",\n'
              '            },\n'
              '        )\n\n'
              '    if data.get("status") != "approved":\n'
              '        raise HTTPException(\n'
              '            status_code=status.HTTP_409_CONFLICT,\n'
              '            detail="Consent request is not approved",\n'
              '        )\n',
          )

          # Client device inventory now carries exact server key-version identity.
          replace_once(
              'nexa-client/packages/app/services/deviceKeys.ts',
              'export interface EnrollDeviceResponse {\n  device_id: string\n  status: string',
              'export interface EnrollDeviceResponse {\n  device_id: string\n  key_id: string\n  key_version: number\n  status: string',
          )
          replace_once(
              'nexa-client/packages/app/services/deviceKeys.ts',
              'export interface DeviceInfo {\n  device_id: string\n  device_label:',
              'export interface DeviceInfo {\n  device_id: string\n  key_id: string\n  key_version: number\n  device_label:',
          )

          device_keys = Path('nexa-client/packages/app/services/deviceKeys.ts')
          text = device_keys.read_text(encoding='utf-8')
          marker = "export async function signConsentChallenge(params: ConsentSigningFields): Promise<string> {\n"
          if text.count(marker) != 1:
              raise SystemExit('deviceKeys.ts V2 signing function anchor missing')
          if 'export interface ConsentSigningFieldsV3' not in text:
              text += '''\n\nexport interface ConsentSigningFieldsV3 {\n  request_id: string\n  patient_id: string\n  provider_id: string\n  hospital_id: string\n  challenge_nonce: string\n  decision: 'approved' | 'denied'\n  scope: string\n  purpose: string\n  access_duration: number\n  issued_at: string\n  expires_at: string\n  consent_context_hash: string\n  device_id: string\n  key_id: string\n  key_version: number\n  public_key_fingerprint: string\n}\n\nexport function constructConsentSigningInputV3(params: ConsentSigningFieldsV3): string {\n  return JSON.stringify({\n    access_duration: params.access_duration,\n    challenge_nonce: params.challenge_nonce,\n    consent_context_hash: params.consent_context_hash,\n    decision: params.decision,\n    device_id: params.device_id,\n    domain: 'NEXA_CARE_SIGNED_CONSENT',\n    expires_at: params.expires_at,\n    hospital_id: params.hospital_id,\n    issued_at: params.issued_at,\n    key_id: params.key_id,\n    key_version: params.key_version,\n    operation: 'CONSENT_DECISION',\n    patient_id: params.patient_id,\n    protocol_version: 'nexa-consent-v3',\n    provider_id: params.provider_id,\n    public_key_fingerprint: params.public_key_fingerprint,\n    purpose: params.purpose,\n    request_id: params.request_id,\n    scope: params.scope,\n  })\n}\n\nexport async function signConsentChallengeV3(params: ConsentSigningFieldsV3): Promise<string> {\n  const encodedPrivateKey = await SecureStore.getItemAsync(DEVICE_PRIVATE_KEY_STORAGE_KEY)\n  if (!encodedPrivateKey)\n    throw new Error(\n      'This device is not enrolled. Please secure this device before approving consent.'\n    )\n  const message = new TextEncoder().encode(constructConsentSigningInputV3(params))\n  const digest = new Uint8Array(await Crypto.digest(Crypto.CryptoDigestAlgorithm.SHA256, message))\n  return bytesToBase64(p256.sign(digest, base64ToBytes(encodedPrivateKey)).toDERRawBytes())\n}\n'''
              device_keys.write_text(text, encoding='utf-8')

          # Exact current-device resolution must return the immutable key row and version.
          replace_once(
              'nexa-client/packages/app/services/currentDeviceEnrollment.ts',
              'export interface CurrentDeviceEnrollment {\n  deviceId: string\n  status:',
              'export interface CurrentDeviceEnrollment {\n  deviceId: string\n  keyId: string\n  keyVersion: number\n  status:',
          )
          replace_once(
              'nexa-client/packages/app/services/currentDeviceEnrollment.ts',
              '        deviceId: exactActiveDevice.device_id,\n        status:',
              '        deviceId: exactActiveDevice.device_id,\n        keyId: exactActiveDevice.key_id,\n        keyVersion: exactActiveDevice.key_version,\n        status:',
          )
          replace_once(
              'nexa-client/packages/app/services/currentDeviceEnrollment.ts',
              '        deviceId: fingerprintMatchedDevice.device_id,\n        status:',
              '        deviceId: fingerprintMatchedDevice.device_id,\n        keyId: fingerprintMatchedDevice.key_id,\n        keyVersion: fingerprintMatchedDevice.key_version,\n        status:',
          )
          replace_once(
              'nexa-client/packages/app/services/currentDeviceEnrollment.ts',
              '      deviceId: enrollment.device_id,\n      status:',
              '      deviceId: enrollment.device_id,\n      keyId: enrollment.key_id,\n      keyVersion: enrollment.key_version,\n      status:',
          )

          # Mobile consent orchestration moves to explicit V3 only.
          replace_once(
              'nexa-client/packages/app/services/consentSigning.ts',
              '  constructConsentSigningInput,\n  signConsentChallenge,',
              '  constructConsentSigningInputV3,\n  signConsentChallengeV3,',
          )
          replace_once(
              'nexa-client/packages/app/services/consentSigning.ts',
              'export const constructSigningInput = constructConsentSigningInput\nexport const signConsentDecision = signConsentChallenge',
              'export const constructSigningInput = constructConsentSigningInputV3\nexport const signConsentDecision = signConsentChallengeV3',
          )
          replace_once(
              'nexa-client/packages/app/services/consentSigning.ts',
              "  protocol_version: 'nexa-consent-v2'\n  request_id: string\n  patient_id: string\n  provider_id: string\n",
              "  protocol_version: 'nexa-consent-v3'\n  request_id: string\n  patient_id: string\n  provider_id: string\n  hospital_id: string\n",
          )
          replace_once(
              'nexa-client/packages/app/services/consentSigning.ts',
              '  expires_at: string\n  status: string\n}',
              '  expires_at: string\n  consent_context_hash: string\n  status: string\n}',
          )
          old_submit = '''async function submitSignedDecision(\n  challenge: ConsentChallenge,\n  decision: 'approved' | 'denied',\n  deviceId: string\n): Promise<SignedApprovalResponse> {\n  const signature = await signConsentDecision({\n    request_id: challenge.request_id,\n    patient_id: challenge.patient_id,\n    provider_id: challenge.provider_id,\n    challenge_nonce: challenge.challenge_nonce,\n    decision,\n    scope: challenge.scope,\n    purpose: challenge.purpose,\n    access_duration: challenge.access_duration,\n    issued_at: challenge.issued_at,\n    expires_at: challenge.expires_at,\n    device_id: deviceId,\n  })\n  const payload = {\n    request_id: challenge.request_id,\n    patient_id: challenge.patient_id,\n    decision,\n    challenge_nonce: challenge.challenge_nonce,\n    signature,\n    device_id: deviceId,\n  }\n'''
          new_submit = '''async function submitSignedDecision(\n  challenge: ConsentChallenge,\n  decision: 'approved' | 'denied',\n  device: { deviceId: string; keyId: string; keyVersion: number; keyFingerprint: string }\n): Promise<SignedApprovalResponse> {\n  const signature = await signConsentDecision({\n    request_id: challenge.request_id,\n    patient_id: challenge.patient_id,\n    provider_id: challenge.provider_id,\n    hospital_id: challenge.hospital_id,\n    challenge_nonce: challenge.challenge_nonce,\n    decision,\n    scope: challenge.scope,\n    purpose: challenge.purpose,\n    access_duration: challenge.access_duration,\n    issued_at: challenge.issued_at,\n    expires_at: challenge.expires_at,\n    consent_context_hash: challenge.consent_context_hash,\n    device_id: device.deviceId,\n    key_id: device.keyId,\n    key_version: device.keyVersion,\n    public_key_fingerprint: device.keyFingerprint,\n  })\n  const payload = {\n    protocol_version: 'nexa-consent-v3' as const,\n    request_id: challenge.request_id,\n    patient_id: challenge.patient_id,\n    decision,\n    challenge_nonce: challenge.challenge_nonce,\n    consent_context_hash: challenge.consent_context_hash,\n    signature,\n    device_id: device.deviceId,\n    key_id: device.keyId,\n    key_version: device.keyVersion,\n    public_key_fingerprint: device.keyFingerprint,\n  }\n'''
          replace_once('nexa-client/packages/app/services/consentSigning.ts', old_submit, new_submit)
          replace_once(
              'nexa-client/packages/app/services/consentSigning.ts',
              "  return submitSignedDecision(challenge, 'approved', currentDevice.deviceId)",
              "  return submitSignedDecision(challenge, 'approved', currentDevice)",
          )
          replace_once(
              'nexa-client/packages/app/services/consentSigning.ts',
              "  return submitSignedDecision(challenge, 'denied', currentDevice.deviceId)",
              "  return submitSignedDecision(challenge, 'denied', currentDevice)",
          )

          # Shared client types and endpoints move to V3 explicitly.
          replace_once(
              'nexa-client/packages/app/utils/apiClient.ts',
              'export interface ConsentChallengeRequest {\n  discovery_handle:',
              "export interface ConsentChallengeRequest {\n  protocol_version: 'nexa-consent-v3'\n  discovery_handle:",
          )
          replace_once(
              'nexa-client/packages/app/utils/apiClient.ts',
              'export interface ConsentChallengeResponse {\n  request_id:',
              "export interface ConsentChallengeResponse {\n  protocol_version: 'nexa-consent-v3'\n  request_id:",
          )
          replace_once(
              'nexa-client/packages/app/utils/apiClient.ts',
              "  protocol_version: 'nexa-consent-v2'\n  request_id: string\n  patient_id: string\n  provider_id: string\n",
              "  protocol_version: 'nexa-consent-v3'\n  request_id: string\n  patient_id: string\n  provider_id: string\n  hospital_id: string\n",
          )
          replace_once(
              'nexa-client/packages/app/utils/apiClient.ts',
              '  expires_at: string\n  status: string\n}\n\nexport interface SignedApprovalRequest {',
              '  expires_at: string\n  consent_context_hash: string\n  status: string\n}\n\nexport interface SignedApprovalRequest {',
          )
          replace_once(
              'nexa-client/packages/app/utils/apiClient.ts',
              'export interface SignedApprovalRequest {\n  request_id: string\n  patient_id: string\n  decision:',
              "export interface SignedApprovalRequest {\n  protocol_version: 'nexa-consent-v3'\n  request_id: string\n  patient_id: string\n  decision:",
          )
          replace_once(
              'nexa-client/packages/app/utils/apiClient.ts',
              '  challenge_nonce: string\n  signature: string\n  device_id: string\n}',
              '  challenge_nonce: string\n  consent_context_hash: string\n  signature: string\n  device_id: string\n  key_id: string\n  key_version: number\n  public_key_fingerprint: string\n}',
          )
          for old, new in [
              ("'/api/v2/consent/request'", "'/api/v2/consent/v3/request'"),
              ('`/api/v2/consent/challenge/${requestId}`', '`/api/v2/consent/v3/challenge/${requestId}`'),
              ("'/api/v2/consent/approve-signed'", "'/api/v2/consent/v3/approve-signed'"),
              ('`/api/v2/consent/${encodeURIComponent(requestId)}/claim-access`', '`/api/v2/consent/v3/${encodeURIComponent(requestId)}/claim-access`'),
          ]:
              # approve-signed appears twice (approve + deny) and is handled separately.
              p = Path('nexa-client/packages/app/utils/apiClient.ts')
              t = p.read_text(encoding='utf-8')
              if old == "'/api/v2/consent/approve-signed'":
                  if t.count(old) != 2:
                      raise SystemExit(f'apiClient approve V2 path count {t.count(old)}')
                  t = t.replace(old, new)
              else:
                  if t.count(old) != 1:
                      raise SystemExit(f'apiClient path anchor count {t.count(old)}: {old}')
                  t = t.replace(old, new, 1)
              p.write_text(t, encoding='utf-8')

          replace_once(
              'nexa-client/packages/app/features/doctor/RequestConsentScreen.tsx',
              '        {\n          discovery_handle: discoverySelection.discoveryHandle,',
              "        {\n          protocol_version: 'nexa-consent-v3',\n          discovery_handle: discoverySelection.discoveryHandle,",
          )

          # Keep the patient-side service contract test on the new exact key identity.
          replace_once(
              'nexa-client/packages/app/services/consentSigning.test.ts',
              '  constructConsentSigningInput: vi.fn(() => \'canonical-input\'),\n  signConsentChallenge: mocks.sign,',
              '  constructConsentSigningInputV3: vi.fn(() => \'canonical-input\'),\n  signConsentChallengeV3: mocks.sign,',
          )
          replace_once(
              'nexa-client/packages/app/services/consentSigning.test.ts',
              "  protocol_version: 'nexa-consent-v2' as const,\n  request_id: 'request-1',\n  patient_id: 'patient-1',\n  provider_id: 'provider-1',",
              "  protocol_version: 'nexa-consent-v3' as const,\n  request_id: 'request-1',\n  patient_id: 'patient-1',\n  provider_id: 'provider-1',\n  hospital_id: 'hospital-1',",
          )
          replace_once(
              'nexa-client/packages/app/services/consentSigning.test.ts',
              "  expires_at: '2099-01-01T00:00:00Z',\n  status: 'pending',",
              "  expires_at: '2099-01-01T00:00:00Z',\n  consent_context_hash: 'a'.repeat(64),\n  status: 'pending',",
          )
          replace_once(
              'nexa-client/packages/app/services/consentSigning.test.ts',
              "      deviceId: 'current-device',\n      status: 'active',",
              "      deviceId: 'current-device',\n      keyId: 'current-key',\n      keyVersion: 3,\n      status: 'active',",
          )
          replace_once(
              'nexa-client/packages/app/services/consentSigning.test.ts',
              "        device_id: 'current-device',\n      })",
              "        protocol_version: 'nexa-consent-v3',\n        device_id: 'current-device',\n        key_id: 'current-key',\n        key_version: 3,\n        public_key_fingerprint: 'fingerprint',\n        consent_context_hash: 'a'.repeat(64),\n      })",
          )

          # Doctor API-client test calls must now identify V3 explicitly.
          api_test = Path('nexa-client/packages/app/utils/apiClient.test.ts')
          text = api_test.read_text(encoding='utf-8')
          anchor = "      {\n        discovery_handle: 'opaque-discovery-handle-12345678901234567890',"
          if anchor in text:
              text = text.replace(
                  anchor,
                  "      {\n        protocol_version: 'nexa-consent-v3',\n        discovery_handle: 'opaque-discovery-handle-12345678901234567890',",
                  1,
              )
          api_test.write_text(text, encoding='utf-8')

          # Route registry must explicitly contain V3 endpoints.
          registry = Path('tests/test_api_contracts.py')
          text = registry.read_text(encoding='utf-8')
          anchor = '        ("POST", "/api/v2/consent/request"),\n'
          if text.count(anchor) != 1:
              raise SystemExit('test_api_contracts route anchor missing')
          text = text.replace(
              anchor,
              anchor
              + '        ("POST", "/api/v2/consent/v3/request"),\n'
              + '        ("POST", "/api/v2/consent/v3/approve-signed"),\n'
              + '        ("POST", "/api/v2/consent/v3/{request_id}/claim-access"),\n',
              1,
          )
          registry.write_text(text, encoding='utf-8')
          PY

          python -m compileall -q app tests
          git rm .github/workflows/slice-6f-implementation-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app nexa-client tests .github/workflows/slice-6f-implementation-patch.yml
          git diff --cached --check
          git commit -m "feat(consent): wire Signed Consent V3 authority"
          git push origin HEAD:slice-6f-signed-consent-v3
