name: Azure staging build and contracts

on:
  pull_request:
    branches: [main]
    paths:
      - "deploy/azure/**"
      - "scripts/*azure_staging*.py"
      - "tests/test_azure_staging_runtime.py"
      - ".github/workflows/azure-staging-offline.yml"

permissions:
  contents: read

concurrency:
  group: azure-staging-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify the original entry pages against the selected baseline
        run: |
          git diff --exit-code 6f9959d8ad48804c3bfdac3501fb480f7e2f7708 HEAD -- \
            nexa-client/apps/next/app/page.tsx nexa-client/apps/next/app/patient/login/page.tsx
          test ! -e nexa-client/apps/next/app/demo/patient/page.tsx
      - name: Compile Azure templates with the pinned Bicep compiler
        run: |
          curl -fsSL --retry 3 --max-time 90 -o "$RUNNER_TEMP/bicep" \
            https://github.com/Azure/bicep/releases/download/v0.49.2/bicep-linux-x64
          printf '%s  %s\n' '0ab9de90c2493f206f8281bae74f9ee2d5ed3605548dab1adf41fef185e1f7c5' "$RUNNER_TEMP/bicep" | sha256sum -c
          chmod 0755 "$RUNNER_TEMP/bicep"
          for template in deploy/azure/*.bicep; do
            "$RUNNER_TEMP/bicep" build "$template" --outfile "$RUNNER_TEMP/$(basename "$template" .bicep).json"
          done
      - name: Test staging isolation, production configuration and migration contracts
        run: |
          python -m pip install -r requirements.txt -r requirements_dev.txt
          python -m pytest -q tests/test_azure_staging_runtime.py \
            tests/staging/test_staging_otp_guard.py tests/test_pilot_deployment_hardening.py \
            tests/test_migration_graph.py tests/test_original_document_contract.py

  build-images:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build real FastAPI and check its packaged runtime
        run: |
          docker build --build-arg INSTALL_AZURE_SDK=true -t nexa-azure-api:ci .
          docker run --rm --network none --entrypoint python nexa-azure-api:ci -c \
            'import azure.identity; import boto3; from pathlib import Path; assert Path("/etc/ssl/certs/ca-certificates.crt").is_file()'
          if docker run --rm --network none -e ENVIRONMENT=staging nexa-azure-api:ci > "$RUNNER_TEMP/unsafe-start.log" 2>&1; then
            exit 1
          fi
          rg -F 'ERROR: unsafe container startup configuration' "$RUNNER_TEMP/unsafe-start.log"
      - name: Build the original Next frontend and run readiness tests
        run: |
          docker build --target build -f nexa-client/Dockerfile.azure-staging -t nexa-azure-web:ci \
            --build-arg NEXT_PUBLIC_API_URL=https://nexa-stg-web.test-central.centralindia.azurecontainerapps.io \
            --build-arg API_PROXY_TARGET=https://nexa-stg-api.internal.test-central.centralindia.azurecontainerapps.io \
            nexa-client
          docker run --rm --network none nexa-azure-web:ci yarn vitest run -c vitest.config.mts \
            apps/next/__tests__/azure-staging-readiness.test.ts
      - name: Build the pinned scanner with current signatures
        run: docker build -t nexa-azure-clamd:ci scanner_integration
