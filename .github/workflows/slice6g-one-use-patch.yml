name: One-use Slice 6G atomic enrollment patch

on:
  push:
    branches:
      - slice-6g-cross-boundary-qualification
    paths:
      - .github/workflows/slice6g-one-use-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slice-6g-cross-boundary-qualification
      - name: Apply anchored patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/ci/_slice6g_atomic_enrollment_patch.py')
          text = p.read_text()
          text = text.replace('patient-session-device-consent-1234567890', 'test-current-patient-session')
          p.write_text(text)
          PY
          python scripts/ci/_slice6g_atomic_enrollment_patch.py
          python -m compileall -q app tests scripts
      - name: Commit product changes and self-clean
        run: |
          rm -f .github/workflows/slice6g-one-use-patch.yml scripts/ci/_slice6g_atomic_enrollment_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(auth): atomically bind enrollment finalization to live session"
          git push origin HEAD:slice-6g-cross-boundary-qualification
