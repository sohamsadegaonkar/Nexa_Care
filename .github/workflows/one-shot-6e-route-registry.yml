name: One-shot Slice 6E route registry patch

on:
  push:
    branches:
      - slice-6e-lost-device-account-recovery
    paths:
      - .github/workflows/one-shot-6e-route-registry.yml

permissions:
  contents: write

jobs:
  patch-route-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slice-6e-lost-device-account-recovery
          fetch-depth: 0
      - name: Insert reviewed Slice 6E routes and remove one-shot workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_route_registration.py')
          source = path.read_text()
          needle = '''    ("POST", "/api/v2/patient/devices/{device_id}/rotate"),
              ("POST", "/api/v2/consent/request"),'''
          replacement = '''    ("POST", "/api/v2/patient/devices/{device_id}/rotate"),
              ("POST", "/api/v2/patient/devices/{device_id}/trusted-enrollment/challenge"),
              ("POST", "/api/v2/patient/devices/{device_id}/trusted-enrollment/authorize"),
              ("POST", "/api/v2/patient/devices/recovery/otp/send"),
              ("POST", "/api/v2/patient/devices/recovery/otp/verify"),
              ("POST", "/api/v2/patient/devices/recovery/complete"),
              ("POST", "/api/v2/consent/request"),'''
          if source.count(needle) != 1:
              raise SystemExit('Slice 6E route registry anchor was not unique')
          path.write_text(source.replace(needle, replacement, 1))
          PY
          rm .github/workflows/one-shot-6e-route-registry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_route_registration.py .github/workflows/one-shot-6e-route-registry.yml
          git diff --cached --check
          git commit -m "test(routes): register Slice 6E authority endpoints"
          git push origin HEAD:slice-6e-lost-device-account-recovery
