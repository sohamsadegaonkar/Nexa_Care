name: Recover Slice 6F E2E migration

on:
  push:
    branches: [slice-6f-signed-consent-v3]

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slice-6f-signed-consent-v3
          fetch-depth: 0
      - name: Execute corrected migration payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/slice-6f-e2e-migration.yml').read_text(encoding='utf-8')
          start = "          python - <<'PY'\n"
          end = "          PY\n\n          python -m compileall"
          payload = workflow.split(start, 1)[1].split(end, 1)[0]
          payload = textwrap.dedent(payload)
          payload = payload.replace(
              "if text.count(request_path) != 2:\n    raise SystemExit(f'expected two true-e2e request paths, got {text.count(request_path)}')",
              "if text.count(request_path) != 3:\n    raise SystemExit(f'expected three true-e2e request paths, got {text.count(request_path)}')",
          )
          exec(compile(payload, '<slice-6f-e2e-migration>', 'exec'), {})
          PY

          python -m compileall -q tests/integration/test_patient_provider_true_e2e.py
          git rm .github/workflows/slice-6f-e2e-migration.yml
          git rm .github/workflows/slice-6f-e2e-recover.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(consent): qualify V3 in true provider-patient loop"
          git push origin HEAD:slice-6f-signed-consent-v3
