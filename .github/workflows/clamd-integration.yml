name: Clamd Integration

on:
  pull_request:
    branches: [main]
    paths:
      - "app/security/patient_source_malware_scanner.py"
      - "app/services/patient_external_record_source_safety.py"
      - "app/services/patient_external_record_extraction.py"
      - "app/services/patient_external_record_import.py"
      - "app/core/production_runtime.py"
      - "app/main.py"
      - "deploy/ecs/**"
      - "scripts/check_pilot_environment.py"
      - "scripts/generate_pilot_deployment_values.py"
      - "scanner_integration/**"
      - "tests/test_patient_source_malware_scanner.py"
      - "tests/test_slice_8a_deployment_contract.py"
      - ".github/workflows/clamd-integration.yml"
      - ".github/workflows/live-cloud-qualification.yml"
      - ".github/workflows/rollback-runtime-qualification.yml"
      - "docs/governance/PATIENT_EXTERNAL_RECORD_IMPORT_HANDOFF.md"
      - "docs/runbooks/MILESTONE_6_FARGATE_DEPLOYMENT.md"
      - "requirements.txt"
      - "alembic/**"
  push:
    branches: [main]
    paths:
      - "app/security/patient_source_malware_scanner.py"
      - "app/services/patient_external_record_source_safety.py"
      - "app/services/patient_external_record_extraction.py"
      - "app/services/patient_external_record_import.py"
      - "app/core/production_runtime.py"
      - "app/main.py"
      - "deploy/ecs/**"
      - "scripts/check_pilot_environment.py"
      - "scripts/generate_pilot_deployment_values.py"
      - "scanner_integration/**"
      - "tests/test_patient_source_malware_scanner.py"
      - "tests/test_slice_8a_deployment_contract.py"
      - ".github/workflows/clamd-integration.yml"
      - ".github/workflows/live-cloud-qualification.yml"
      - ".github/workflows/rollback-runtime-qualification.yml"
      - "docs/governance/PATIENT_EXTERNAL_RECORD_IMPORT_HANDOFF.md"
      - "docs/runbooks/MILESTONE_6_FARGATE_DEPLOYMENT.md"
      - "requirements.txt"
      - "alembic/**"

permissions:
  contents: read

jobs:
  clamd:
    name: Real Clamd Patient Source Qualification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexa
          POSTGRES_PASSWORD: nexa_test
          POSTGRES_DB: nexa_d6
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 2s
          --health-retries 10

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://nexa:nexa_test@127.0.0.1:5432/nexa_d6
      TEST_DATABASE_URL: postgresql+asyncpg://nexa:nexa_test@127.0.0.1:5432/nexa_d6
      NEXA_ALLOW_DISPOSABLE_TEST_DB: "1"
      DOCUMENT_EXTRACTION_PROVIDER: demo
      DOCUMENT_STORAGE_PROVIDER: local
      DOCUMENT_STORAGE_LOCAL_ROOT: /tmp/nexa-d6-documents
      DOCUMENT_STORAGE_ENCRYPTION_KEY: vkMf8Y8z-UZyqKKtoI2AjRiGgQinLUGH7jrr4hc8vLw=
      ENCRYPTION_BACKEND: local
      KEK_ROOT_SECRET: d6-integration-kek-root-secret-32-bytes-minimum
      MAX_UPLOAD_BYTES: "20971520"
      PATIENT_SOURCE_MALWARE_SCANNER: clamd
      PATIENT_SOURCE_CLAMD_HOST: 127.0.0.1
      PATIENT_SOURCE_CLAMD_PORT: "3310"
      PATIENT_SOURCE_CLAMD_CONNECT_TIMEOUT_SECONDS: "2"
      PATIENT_SOURCE_CLAMD_SCAN_TIMEOUT_SECONDS: "30"
      PATIENT_SOURCE_CLAMD_MAX_BYTES: "20971520"
      PATIENT_SOURCE_CLAMD_MAX_SIGNATURE_AGE_HOURS: "168"

    steps:
      - uses: actions/checkout@v4

      - name: Build qualified non-base scanner image
        run: |
          docker build \
            --tag local/patient-source-clamd:qualified \
            --file scanner_integration/Dockerfile .

      - name: Record scanner build evidence
        run: |
          echo "=== Base Image Digest ==="
          echo "clamav/clamav:1.4.6-debian@sha256:2463487b937071421c0ddadac6616111bedba45b9bd9312bbb4591b57450f8f4"
          echo "=== Derived Image Digest ==="
          docker inspect --format='{{index .Id}}' local/patient-source-clamd:qualified
          echo "=== Baked ClamAV Version and Signatures ==="
          docker run --rm local/patient-source-clamd:qualified clamdscan --version

      - name: Start qualified clamd scanner container
        run: |
          docker run -d \
            --name patient-source-clamd \
            -p 3310:3310 \
            -e CLAMAV_NO_CLAMD=false \
            -e CLAMAV_NO_FRESHCLAMD=true \
            -e CLAMAV_NO_MILTERD=true \
            -e CLAMD_STARTUP_TIMEOUT=300 \
            local/patient-source-clamd:qualified

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements_dev.txt

      - name: Prepare disposable schema
        run: alembic upgrade head

      - name: Verify real clamd readiness contract
        run: |
          python - <<'PY'
          import asyncio
          import time
          from app.security.patient_source_malware_scanner import (
              ClamdPatientSourceMalwareScanner,
              get_patient_source_malware_scanner_config,
          )

          MAX_WAIT_SECONDS = 120
          POLL_INTERVAL_SECONDS = 5

          async def wait_for_readiness() -> None:
              config = get_patient_source_malware_scanner_config()
              scanner = ClamdPatientSourceMalwareScanner(config)
              start_time = time.monotonic()

              while time.monotonic() - start_time < MAX_WAIT_SECONDS:
                  try:
                      if await scanner.ready():
                          print("REAL_CLAMD_READINESS=PASS")
                          return
                  except Exception as exc:
                      print(f"Waiting for clamd readiness ({type(exc).__name__})...")
                  await asyncio.sleep(POLL_INTERVAL_SECONDS)

              raise SystemExit("real clamd readiness failed: timeout waiting for fresh signatures")

          asyncio.run(wait_for_readiness())
          PY

      - name: Run real scanner-backed patient qualification
        run: python -m pytest scanner_integration/ -q --tb=short

      - name: Stop scanner container
        if: always()
        run: |
          docker stop patient-source-clamd || true
          docker rm patient-source-clamd || true

      - name: Qualification complete
        run: echo "REAL_CLAMD_PATIENT_SOURCE_QUALIFICATION=PASS"
