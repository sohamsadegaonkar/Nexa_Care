name: One-use Slice 6G Redis fixture cleanup

on:
  push:
    branches:
      - slice-6g-cross-boundary-qualification
    paths:
      - .github/workflows/slice6g-redis-close-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slice-6g-cross-boundary-qualification
      - name: Patch pinned redis-py cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/integration/test_slice6g_cross_boundary_postgres_redis.py')
          text = p.read_text()
          old = '''    finally:\n        await client.aclose()\n        await pool.aclose()\n'''
          new = '''    finally:\n        await client.close()\n        await pool.disconnect(inuse_connections=True)\n'''
          if text.count(old) != 1:
              raise SystemExit('redis fixture cleanup anchor mismatch')
          p.write_text(text.replace(old, new, 1))
          PY
          python -m compileall -q tests/integration/test_slice6g_cross_boundary_postgres_redis.py
      - name: Commit and self-clean
        run: |
          rm -f .github/workflows/slice6g-redis-close-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(qualification): support pinned Redis cleanup API"
          git push origin HEAD:slice-6g-cross-boundary-qualification
