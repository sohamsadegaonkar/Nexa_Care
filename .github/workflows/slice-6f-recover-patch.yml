name: Recover one-use Slice 6F patch

on:
  push:
    branches: [slice-6f-signed-consent-v3]

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: slice-6f-signed-consent-v3
          fetch-depth: 0
      - name: Execute original patch payload and commit safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/slice-6f-implementation-patch.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n\n          python -m compileall"
          if workflow.count(start_marker) != 1 or workflow.count(end_marker) != 1:
              raise SystemExit('unable to locate original one-use Python patch payload')
          payload = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          payload = textwrap.dedent(payload)
          exec(compile(payload, '<slice-6f-patch>', 'exec'), {})
          PY

          python -m compileall -q app tests
          git rm .github/workflows/slice-6f-implementation-patch.yml
          git rm .github/workflows/slice-6f-recover-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(consent): wire Signed Consent V3 authority"
          git push origin HEAD:slice-6f-signed-consent-v3
